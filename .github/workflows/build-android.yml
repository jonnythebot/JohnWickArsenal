# John Wick Arsenal - GitHub Actions Build Pipeline
# Builds Android AssetBundle for Blade & Sorcery Nomad mod
# Supports manual dispatch, scheduled runs, and release tags
#
# IMPORTANT: DLL build requires Blade & Sorcery assemblies (local only).
# AssetBundle build runs in CI using the pre-built DLL.

name: Build Android Mod

on:
  workflow_dispatch:
    inputs:
      unity_version:
        description: 'Unity version to use (must be 2022.3.x LTS)'
        required: false
        default: '2022.3.20f1'
        type: choice
        options:
          - '2022.3.20f1'
          - '2022.3.15f1'
          - '2022.3.25f1'
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - 'Release'
          - 'Debug'
      clean_build:
        description: 'Clean build cache before building'
        required: false
        default: true
        type: boolean

  push:
    branches: [master]
    paths:
      - 'Source/**'
      - 'UnityProject/**'
      - 'mod.json'
      - 'icon.png'
      - '.github/workflows/build-android.yml'
      - 'build.sh'

  pull_request:
    branches: [master]

  release:
    types: [published]

  schedule:
    # Weekly build every Monday 02:00 UTC to catch Unity/dependency updates
    - cron: '0 2 * * 1'

env:
  MOD_NAME: JohnWickArsenal
  UNITY_VERSION: ${{ github.event.inputs.unity_version || '2022.3.20f1' }}
  UNITY_PROJECT_PATH: ./UnityProject
  SOURCE_DIR: ./Source/JohnWickArsenal
  ASSEMBLY_OUTPUT: ./Assemblies
  BUNDLE_OUTPUT: ./AssetBundles/Android
  MOD_OUTPUT: ./BuildOutput
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
  CLEAN_BUILD: ${{ github.event.inputs.clean_build || 'true' }}
  # Unity license must be provided as secret for CI builds
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

jobs:
  # ---------------------------------------------------------
  # Setup: Cache key generation
  # ---------------------------------------------------------
  setup:
    name: Setup & Cache Keys
    runs-on: ubuntu-22.04
    outputs:
      unity_cache_key: ${{ steps.cache_keys.outputs.unity }}
      dotnet_cache_key: ${{ steps.cache_keys.outputs.dotnet }}
      android_cache_key: ${{ steps.cache_keys.outputs.android }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Generate cache keys
        id: cache_keys
        run: |
          echo "unity=unity-${{ env.UNITY_VERSION }}-${{ hashFiles('UnityProject/Packages/packages-lock.json') }}" >> $GITHUB_OUTPUT
          echo "dotnet=dotnet-${{ hashFiles('Source/JohnWickArsenal/JohnWickArsenal.csproj') }}" >> $GITHUB_OUTPUT
          echo "android=android-${{ hashFiles('.github/workflows/build-android.yml') }}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------
  # Install Unity, .NET SDK, Android SDK
  # ---------------------------------------------------------
  install_dependencies:
    name: Install Dependencies
    runs-on: ubuntu-22.04
    needs: setup
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # --- Unity Installation ---
      - name: Restore Unity cache
        id: restore_unity_cache
        uses: actions/cache@v4
        with:
          path: /opt/unity
          key: ${{ needs.setup.outputs.unity_cache_key }}
          restore-keys: |
            unity-${{ env.UNITY_VERSION }}-
            unity-

      - name: Install Unity
        if: steps.restore_unity_cache.outputs.cache-hit != 'true'
        env:
          UNITY_VERSION: ${{ env.UNITY_VERSION }}
        run: |
          echo "Installing Unity ${{ env.UNITY_VERSION }}..."
          # Use official Unity download URL format
          # Format: https://download.unity3d.com/download_unity/<hash>/LinuxEditorInstaller/Unity-<version>.tar.xz
          # We need to fetch the hash for the specific version
          UNITY_MAJOR=$(echo "${UNITY_VERSION}" | cut -d'.' -f1,2)  # 2022.3
          UNITY_FULL="${UNITY_VERSION}"

          # Download Unity using the known download pattern
          # For 2022.3.x versions, use the public download URL
          UNITY_URL="https://download.unity3d.com/download_unity/${UNITY_FULL}/LinuxEditorInstaller/Unity-${UNITY_FULL}.tar.xz"

          echo "Attempting download from: $UNITY_URL"
          wget --show-progress "$UNITY_URL" -O /tmp/Unity.tar.xz

          if [ ! -f /tmp/Unity.tar.xz ] || [ $(stat -c%s /tmp/Unity.tar.xz) -lt 100000000 ]; then
            echo "::warning::Download failed or file too small, trying fallback URL..."
            # Fallback: try without hash in URL (older versions)
            UNITY_URL_FALLBACK="https://download.unity3d.com/download_unity/Unity-${UNITY_FULL}.tar.xz"
            wget --show-progress "$UNITY_URL_FALLBACK" -O /tmp/Unity.tar.xz
          fi

          sudo mkdir -p /opt/unity
          sudo tar -xf /tmp/Unity.tar.xz -C /opt/unity --strip-components=1 2>/dev/null || {
            echo "::error::Failed to extract Unity. Checking download..."
            ls -lh /tmp/Unity.tar.xz
            file /tmp/Unity.tar.xz
            exit 1
          }
          echo "UNITY_EXECUTABLE=/opt/unity/Unity" >> $GITHUB_ENV

      - name: Verify Unity installation
        run: |
          export UNITY_EXECUTABLE=${UNITY_EXECUTABLE:-/opt/unity/Unity}
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2 libgtk-3-0 libnss3 libasound2 libgconf-2-4
          $UNITY_EXECUTABLE -version
          echo "Unity executable: $UNITY_EXECUTABLE"

      # --- .NET SDK ---
      - name: Restore .NET cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ needs.setup.outputs.dotnet_cache_key }}
          restore-keys: |
            dotnet-

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # --- Android SDK ---
      - name: Restore Android SDK cache
        id: restore_android_cache
        uses: actions/cache@v4
        with:
          path: /opt/android-sdk
          key: ${{ needs.setup.outputs.android_cache_key }}
          restore-keys: |
            android-

      - name: Install Android SDK
        if: steps.restore_android_cache.outputs.cache-hit != 'true'
        run: |
          echo "Installing Java 17..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version

          echo "Installing Android SDK command line tools..."
          mkdir -p /opt/android-sdk/cmdline-tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip" -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/android-cmdtools
          mkdir -p /opt/android-sdk/cmdline-tools/latest
          mv /tmp/android-cmdtools/cmdline-tools/* /opt/android-sdk/cmdline-tools/latest/
          test -x /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager

          # Accept licenses and install packages
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;25.1.8937393"

          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:/opt/android-sdk/platform-tools:/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_ENV

      - name: Verify Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/opt/android-sdk}
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin
          adb version

  # ---------------------------------------------------------
  # Build Managed DLL (LOCAL ONLY - requires B&S assemblies)
  # This job runs in CI but will fail without B&S assemblies.
  # For actual DLL builds, run locally with build.sh
  # ---------------------------------------------------------
  build_dll:
    name: Build Managed DLL (Local Only)
    runs-on: ubuntu-22.04
    needs: [setup, install_dependencies]
    timeout-minutes: 15
    if: ${{ false }}  # DISABLED in CI - requires B&S assemblies only available locally
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: |
          cd ${{ env.SOURCE_DIR }}
          dotnet restore JohnWickArsenal.csproj -v quiet

      - name: Build DLL
        run: |
          cd ${{ env.SOURCE_DIR }}
          dotnet build JohnWickArsenal.csproj \
            -c ${{ env.CONFIGURATION }} \
            -o ${{ env.ASSEMBLY_OUTPUT }} \
            -v minimal \
            --no-restore

      - name: Verify DLL output
        run: |
          DLL_PATH="${{ env.ASSEMBLY_OUTPUT }}/JohnWickArsenal.dll"
          if [ ! -f "$DLL_PATH" ]; then
            echo "::error::DLL not found at $DLL_PATH"
            exit 1
          fi
          SIZE=$(du -h "$DLL_PATH" | cut -f1)
          echo "✅ DLL built: $DLL_PATH ($SIZE)"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: managed-dll
          path: ${{ env.ASSEMBLY_OUTPUT }}/JohnWickArsenal.dll
          retention-days: 7

  # ---------------------------------------------------------
  # Build AssetBundle with Unity (CI COMPATIBLE)
  # Uses pre-built DLL from local build or falls back to stub
  # ---------------------------------------------------------
  build_bundle:
    name: Build AssetBundle (Unity)
    runs-on: ubuntu-22.04
    needs: [setup, install_dependencies]
    timeout-minutes: 60
    env:
      UNITY_EXECUTABLE: /opt/unity/Unity
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Download pre-built DLL artifact (if available)
        uses: actions/download-artifact@v4
        with:
          name: managed-dll
          path: ${{ env.ASSEMBLY_OUTPUT }}
        continue-on-error: true

      - name: Verify/Generate DLL for Unity
        run: |
          DLL_PATH="${{ env.ASSEMBLY_OUTPUT }}/JohnWickArsenal.dll"
          if [ -f "$DLL_PATH" ]; then
            SIZE=$(du -h "$DLL_PATH" | cut -f1)
            echo "✅ Using pre-built DLL: $DLL_PATH ($SIZE)"
          else
            echo "⚠ No pre-built DLL found. Creating stub for AssetBundle build..."
            echo "   NOTE: For production, run build.sh locally to build the real DLL first."
            mkdir -p ${{ env.ASSEMBLY_OUTPUT }}
            # The Unity build will use the source scripts directly via symlink
            # This is just a placeholder so the build doesn't fail
            echo "Stub DLL - real DLL built locally" > "$DLL_PATH"
          fi

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: unity-library-${{ needs.setup.outputs.unity_cache_key }}-${{ github.sha }}
          restore-keys: |
            unity-library-${{ needs.setup.outputs.unity_cache_key }}-
            unity-library-

      - name: Sync source code to Unity project
        run: |
          mkdir -p ${{ env.UNITY_PROJECT_PATH }}/Assets/Scripts/JohnWickArsenal
          rsync -av --delete \
            --exclude='*.csproj' \
            --exclude='bin' \
            --exclude='obj' \
            --exclude='*.Tests*' \
            --exclude='JohnWickArsenal.asmdef' \
            ${{ env.SOURCE_DIR }}/ ${{ env.UNITY_PROJECT_PATH }}/Assets/Scripts/JohnWickArsenal/

      - name: Create CI-friendly Assembly Definition
        run: |
          cat > ${{ env.UNITY_PROJECT_PATH }}/Assets/Scripts/JohnWickArsenal/JohnWickArsenal.asmdef <<'EOF'
{
  "name": "JohnWickArsenal",
  "references": [
    "Unity.InputSystem",
    "Unity.Addressables",
    "Unity.XR.Management",
    "Unity.XR.Oculus"
  ],
  "includePlatforms": [
    "Android"
  ],
  "excludePlatforms": [],
  "allowUnsafeCode": false,
  "overrideReferences": false,
  "precompiledReferences": [],
  "autoReferenced": true,
  "defineConstraints": [],
  "versionDefines": [],
  "noEngineReferences": false
}
EOF
          echo "Created CI-friendly asmdef (without B&S references)"

      - name: Create Stub B&S Assemblies for Compilation
        run: |
          # Create minimal stub assemblies so scripts can compile
          mkdir -p ${{ env.UNITY_PROJECT_PATH }}/Assets/Plugins/BSCore
          cat > ${{ env.UNITY_PROJECT_PATH }}/Assets/Plugins/BSCore/BladeAndSorcery.Modding.cs <<'EOF'
namespace BladeAndSorcery.Modding
{
    using UnityEngine;
    public class Mod : MonoBehaviour {}
    public class ModBehavior : MonoBehaviour {}
    public class ModOptionAttribute : System.Attribute {}
    public class ModOptionSliderAttribute : System.Attribute { public ModOptionSliderAttribute(float min, float max) {} }
    public class ModOptionToggleAttribute : System.Attribute {}
    public class ModOptionButtonAttribute : System.Attribute { public ModOptionButtonAttribute(string label) {} }
    public class ModOptionColorAttribute : System.Attribute {}
}
EOF
          cat > ${{ env.UNITY_PROJECT_PATH }}/Assets/Plugins/BSCore/BladeAndSorcery.Data.cs <<'EOF'
namespace BladeAndSorcery.Data
{
    using UnityEngine;
    public class ItemData : ScriptableObject {}
    public class WeaponData : ItemData {}
    public class GunData : WeaponData {}
    public class MagazineData : ItemData {}
    public class AmmoData : ItemData {}
    public class ItemModuleData : ScriptableObject {}
    public class WeaponModuleData : ItemModuleData {}
    public class GunModuleData : WeaponModuleData {}
    public class MagazineModuleData : ItemModuleData {}
}
EOF
          cat > ${{ env.UNITY_PROJECT_PATH }}/Assets/Plugins/BSCore/BladeAndSorcery.Gameplay.cs <<'EOF'
namespace BladeAndSorcery.Gameplay
{
    using UnityEngine;
    using System.Collections.Generic;

    public class Item : MonoBehaviour
    {
        public string itemId;
        public virtual void OnHeld(RagdollHand hand) {}
        public virtual void OnReleased(RagdollHand hand) {}
        public virtual void OnFire() {}
        public virtual void OnReloadStart() {}
        public virtual void OnReloadEnd() {}
        public virtual float GetRecoilMultiplier() { return 1f; }
        public virtual float GetSpreadMultiplier() { return 1f; }
    }

    public class Weapon : Item
    {
        public float reloadSpeedMultiplier = 1f;
        public Magazine magazine;
        public Transform muzzlePoint;
        public Transform ejectionPort;
        public Transform gripL;
        public Transform gripR;
        public Transform sightFront;
        public Transform sightRear;
    }

    public class Gun : Weapon
    {
        public int maxAmmo = 30;
        public float fireRate = 600f;
        public bool isAutomatic = true;
        public Transform firePoint;
        public AudioClip fireSound;
        public AudioClip dryFireSound;
        public AudioClip reloadSound;
    }

    public class Magazine : Item
    {
        public int maxCapacity = 30;
        public int CurrentAmmoCount { get; set; }
        public AmmoData ammoData;
        public Transform feedLips;
        public List<Transform> bulletPositions;
    }

    public class Throwable : Item
    {
        public float throwForce = 20f;
        public float damage = 10f;
        public float explosionRadius = 2f;
        public Transform tip;
    }

    public class WeaponBehavior : MonoBehaviour
    {
        protected Weapon weapon;
        protected Gun gun;
        protected Magazine magazine;
        protected virtual void Awake() {}
        protected virtual void OnHeld(RagdollHand hand) {}
        protected virtual void OnReleased(RagdollHand hand) {}
        protected virtual void OnFire() {}
        protected virtual void OnReloadStart() {}
        protected virtual void OnReloadEnd() {}
        protected virtual float GetRecoilMultiplier() { return 1f; }
        protected virtual float GetSpreadMultiplier() { return 1f; }
    }

    public class RagdollHand : MonoBehaviour
    {
        public enum Side { Left, Right }
        public Side side;
    }

    public class Creature : MonoBehaviour {}
    public class Brain : MonoBehaviour {}
    public class Player : Creature {}
    public class NPC : Creature {}
    public class Level : MonoBehaviour {}
    public class Ammo : MonoBehaviour {}
    public class EffectData : ScriptableObject {}
    public class EffectInstance : MonoBehaviour {}
}
EOF
          # Create asmdef for stub assemblies
          cat > ${{ env.UNITY_PROJECT_PATH }}/Assets/Plugins/BSCore/BladeAndSorcery.Modding.asmdef <<'EOF'
{
  "name": "BladeAndSorcery.Modding",
  "references": [],
  "includePlatforms": ["Android"],
  "allowUnsafeCode": false
}
EOF
          cat > ${{ env.UNITY_PROJECT_PATH }}/Assets/Plugins/BSCore/BladeAndSorcery.Data.asmdef <<'EOF'
{
  "name": "BladeAndSorcery.Data",
  "references": ["BladeAndSorcery.Modding"],
  "includePlatforms": ["Android"],
  "allowUnsafeCode": false
}
EOF
          cat > ${{ env.UNITY_PROJECT_PATH }}/Assets/Plugins/BSCore/BladeAndSorcery.Gameplay.asmdef <<'EOF'
{
  "name": "BladeAndSorcery.Gameplay",
  "references": ["BladeAndSorcery.Modding", "BladeAndSorcery.Data"],
  "includePlatforms": ["Android"],
  "allowUnsafeCode": false
}
EOF
          echo "Created stub B&S assemblies for CI compilation"

      - name: Activate Unity License
        if: env.UNITY_LICENSE != ''
        run: |
          echo "Activating Unity license..."
          $UNITY_EXECUTABLE \
            -batchmode \
            -quit \
            -nographics \
            -logFile - \
            -username "${{ secrets.UNITY_USERNAME }}" \
            -password "${{ secrets.UNITY_PASSWORD }}" \
            -serial "${{ secrets.UNITY_SERIAL }}" || {
            echo "::warning::Unity license activation failed. Trying personal license..."
            $UNITY_EXECUTABLE \
              -batchmode \
              -quit \
              -nographics \
              -logFile - \
              -createManualActivationFile /tmp/unity_activation.alf || true
          }

      - name: Run Auto Prefab Creator (Create prefabs from OBJ models)
        run: |
          cd ${{ env.UNITY_PROJECT_PATH }}

          export UNITY_EXECUTABLE=${UNITY_EXECUTABLE:-/opt/unity/Unity}
          echo "Running Auto Prefab Creator..."
          $UNITY_EXECUTABLE \
            -batchmode \
            -quit \
            -nographics \
            -projectPath ${{ env.UNITY_PROJECT_PATH }} \
            -executeMethod JohnWickArsenal.Editor.JWA_AutoPrefabCreator.RunFullPipeline \
            -logFile - \
            2>&1 | tee prefab_creator.log

          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::warning::Auto Prefab Creator had issues (exit code: $EXIT_CODE)"
            cat prefab_creator.log
            # Don't fail - continue to build attempt
          else
            echo "✅ Auto Prefab Creator completed successfully"
          fi

      - name: Run Unity batch build
        run: |
          cd ${{ env.UNITY_PROJECT_PATH }}

          # Ensure we have a valid Unity executable
          export UNITY_EXECUTABLE=${UNITY_EXECUTABLE:-/opt/unity/Unity}
          if [ ! -x "$UNITY_EXECUTABLE" ]; then
            echo "::error::Unity executable not found or not executable: $UNITY_EXECUTABLE"
            exit 1
          fi

          echo "Starting Unity build..."
          $UNITY_EXECUTABLE \
            -batchmode \
            -quit \
            -projectPath ${{ env.UNITY_PROJECT_PATH }} \
            -executeMethod JWA_BuildAssetBundles.BuildBundle \
            -logFile - \
            -buildTarget Android \
            -outputPath ${{ env.BUNDLE_OUTPUT }} \
            -bundleName johnwickarsenal \
            2>&1 | tee unity_build.log

          # Check exit code
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Unity build failed with exit code $EXIT_CODE"
            cat unity_build.log
            exit $EXIT_CODE
          fi

      - name: Verify AssetBundle output
        run: |
          BUNDLE_PATH="${{ env.BUNDLE_OUTPUT }}/johnwickarsenal"
          if [ ! -f "$BUNDLE_PATH" ]; then
            echo "::error::AssetBundle not found at $BUNDLE_PATH"
            ls -la ${{ env.BUNDLE_OUTPUT }}/ 2>/dev/null || echo "Output directory doesn't exist"
            exit 1
          fi

          SIZE=$(du -h "$BUNDLE_PATH" | cut -f1)
          MAGIC=$(head -c 7 "$BUNDLE_PATH")
          if [ "$MAGIC" != "UnityFS" ]; then
            echo "::warning::AssetBundle doesn't have UnityFS header (may be legacy format)"
          fi
          echo "✅ AssetBundle built: $BUNDLE_PATH ($SIZE)"

      - name: Upload AssetBundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: assetbundle-android
          path: ${{ env.BUNDLE_OUTPUT }}/johnwickarsenal
          retention-days: 7

      - name: Upload Unity build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-log
          path: ${{ env.UNITY_PROJECT_PATH }}/unity_build.log
          retention-days: 7

  # ---------------------------------------------------------
  # Package Mod
  # ---------------------------------------------------------
  package:
    name: Package Mod
    runs-on: ubuntu-22.04
    needs: [build_bundle]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download AssetBundle artifact
        uses: actions/download-artifact@v4
        with:
          name: assetbundle-android
          path: ${{ env.BUNDLE_OUTPUT }}

      - name: Download pre-built DLL (required for packaging)
        uses: actions/download-artifact@v4
        with:
          name: managed-dll
          path: ${{ env.ASSEMBLY_OUTPUT }}
        continue-on-error: true

      - name: Package mod
        run: |
          rm -rf ${{ env.MOD_OUTPUT }}
          mkdir -p ${{ env.MOD_OUTPUT }}/${{ env.MOD_NAME }}

          # Required files
          cp mod.json ${{ env.MOD_OUTPUT }}/${{ env.MOD_NAME }}/
          cp icon.png ${{ env.MOD_OUTPUT }}/${{ env.MOD_NAME }}/
          cp README.md ${{ env.MOD_OUTPUT }}/${{ env.MOD_NAME }}/

          # DLL - use pre-built or warn
          if [ -f "${{ env.ASSEMBLY_OUTPUT }}/JohnWickArsenal.dll" ]; then
            cp ${{ env.ASSEMBLY_OUTPUT }}/JohnWickArsenal.dll ${{ env.MOD_OUTPUT }}/${{ env.MOD_NAME }}/
          else
            echo "::warning::No DLL found - mod will not work without local build!"
            echo "Building locally: run ./build.sh on your machine"
          fi

          # AssetBundle
          cp ${{ env.BUNDLE_OUTPUT }}/johnwickarsenal ${{ env.MOD_OUTPUT }}/${{ env.MOD_NAME }}/johnwickarsenal.bundle

          cd ${{ env.MOD_OUTPUT }}
          zip -r ${{ env.MOD_NAME }}_v1.0.0.zip ${{ env.MOD_NAME }}/

          echo "✅ Mod packaged: ${{ env.MOD_OUTPUT }}/${{ env.MOD_NAME }}_v1.0.0.zip"

      - name: Verify package
        run: |
          cd ${{ env.MOD_OUTPUT }}/${{ env.MOD_NAME }}
          REQUIRED=(mod.json icon.png johnwickarsenal.bundle README.md)
          for file in "${REQUIRED[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
            SIZE=$(du -h "$file" | cut -f1)
            echo "  ✓ $file ($SIZE)"
          done

          # DLL is optional in CI (built locally)
          if [ -f "JohnWickArsenal.dll" ]; then
            SIZE=$(du -h "JohnWickArsenal.dll" | cut -f1)
            echo "  ✓ JohnWickArsenal.dll ($SIZE)"
          else
            echo "  ⚠ JohnWickArsenal.dll (built locally)"
          fi

          # Validate mod.json
          python3 -c "
          import json, sys
          with open('mod.json') as f:
              data = json.load(f)
          assert data.get('id') == 'johnwickarsenal', f'Mod ID mismatch: {data.get(\"id\")}'
          assert data.get('version') == '1.0.0', f'Version mismatch: {data.get(\"version\")}'
          print('✅ mod.json valid')
          "
          echo "✅ All verification checks passed"

      - name: Upload mod package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-package
          path: |
            ${{ env.MOD_OUTPUT }}/${{ env.MOD_NAME }}/
            ${{ env.MOD_OUTPUT }}/${{ env.MOD_NAME }}_v1.0.0.zip
          retention-days: 30

  # ---------------------------------------------------------
  # Release: Publish to GitHub Releases
  # ---------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: [package]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
    steps:
      - name: Download mod package
        uses: actions/download-artifact@v4
        with:
          name: mod-package
          path: ${{ env.MOD_OUTPUT }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MOD_OUTPUT }}/${{ env.MOD_NAME }}_v1.0.0.zip
          tag_name: ${{ github.event.release.tag_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------
  # Summary
  # ---------------------------------------------------------
  summary:
    name: Build Summary
    runs-on: ubuntu-22.04
    needs: [build_bundle, package]
    if: always()
    steps:
      - name: Print build status
        run: |
          echo "=== JOHN WICK ARSENAL BUILD SUMMARY ==="
          echo "AssetBundle Build: ${{ needs.build_bundle.result }}"
          echo "Package: ${{ needs.package.result }}"

          if [[ "${{ needs.build_bundle.result }}" == "success" && \
                "${{ needs.package.result }}" == "success" ]]; then
            echo "✅ ALL BUILDS SUCCESSFUL"
          else
            echo "❌ SOME BUILDS FAILED"
            exit 1
          fi