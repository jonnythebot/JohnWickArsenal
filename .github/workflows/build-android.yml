name: Validate Android build inputs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check shell entry points
        run: |
          bash -n build.sh
          bash -n setup.sh
          bash -n verify_structure.sh

      - name: Check Unity project metadata and Python syntax
        run: python3 Tools/validate_android_sources.py
