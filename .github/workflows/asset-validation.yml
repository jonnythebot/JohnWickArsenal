name: Asset Validation (Unity-free)

on:
  push:
    branches: [lightweight, develop/unity-cosmetics-final]
  pull_request:
    branches: [lightweight, develop/unity-cosmetics-final, master]
  workflow_dispatch:

jobs:
  asset-validation:
    name: Unity-free Asset Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # cache: 'pip'  # removed to avoid requiring requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygltflib trimesh numpy pyyaml

      - name: Run Unity-free asset validation
        run: |
          python3 Tools/validate_assets.py

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-output
          path: validation.log

  project-structure-check:
    name: Project Structure Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify project structure
        run: |
          python3 Tools/ci/validate_structure.py

  manifest-check:
    name: Manifest & Version Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate manifest.json
        run: |
          python3 Tools/ci/validate_manifest.py

      - name: Validate ProjectVersion.txt
        run: |
          python3 Tools/ci/validate_version.py

      - name: Validate asmdef files
        run: |
          python3 Tools/ci/validate_asmdefs.py

  glb-validation:
    name: GLB Model Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # cache: 'pip'  # removed to avoid requiring requirements.txt

      - name: Install dependencies
        run: |
          pip install pygltflib trimesh numpy

      - name: Validate GLB models
        run: |
          python3 Tools/ci/validate_glb.py